image:
  registry: ghcr.io
  repository: ""  # Will be set from workflow
  tag: latest    # Will be set from workflow
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

resources:
  limits:
    cpu: 100m
    memory: 512Mi
  requests:
    cpu: 30m
    memory: 256Mi

ports:
  - name: http
    containerPort: 8080
    protocol: TCP
  - name: debug
    containerPort: 5005
    protocol: TCP

route:
  enabled: true
  host: ""  # Will be set from environment variable
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 95
  targetMemoryUtilizationPercentage: 95

readinessProbe:
 httpGet:
   path: /q/health/ready
   port: http
 initialDelaySeconds: 30
 periodSeconds: 10
 timeoutSeconds: 2
 failureThreshold: 15
 successThreshold: 1

livenessProbe:
 httpGet:
   path: /q/health/live
   port: http
 initialDelaySeconds: 30
 periodSeconds: 10
 timeoutSeconds: 2
 failureThreshold: 15
 successThreshold: 1